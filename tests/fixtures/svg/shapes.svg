<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200mm" height="100mm" viewBox="0 0 400 200">
  <title>Fixture</title>
  <style type="text/css"><![CDATA[
    /* shared classes */
    .blue { fill: #0000ff; stroke: #000080; stroke-width: 2 }
    rect.big { stroke-dasharray: 8 4 }
    #special { fill: #00ff00 }
    .hidden { display: none }
  ]]></style>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="lg2" xlink:href="#lg" x1="0" y1="0" x2="1" y2="0"/>
    <radialGradient id="rg"><stop offset="0" style="stop-color:#ffffff"/><stop offset="1" style="stop-color:#000000"/></radialGradient>
    <symbol id="sym" viewBox="0 0 10 10"><rect width="10" height="10" fill="#123456"/><circle cx="5" cy="5" r="2" fill="#ffffff"/></symbol>
    <circle id="dot" r="5" fill="#ff00ff"/>
    <marker id="arrow" markerWidth="10" markerHeight="10"><path d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect id="r1" x="10" y="10" width="60" height="30" class="blue big"/>
  <rect id="special" x="80" y="10" width="40" height="30" rx="5" style="stroke:none"/>
  <g transform="translate(150 10) scale(2)" fill="#ffa500" opacity="0.5">
    <rect x="0" y="0" width="20" height="10" stroke="#000" stroke-width="1"/>
    <g transform="translate(25 0)">
      <circle cx="5" cy="5" r="5" fill-opacity="0.5"/>
      <ellipse cx="20" cy="5" rx="8" ry="4" fill="url(#rg)"/>
    </g>
  </g>
  <rect x="250" y="10" width="40" height="20" transform="rotate(45 270 20)" fill="url(#lg)"/>
  <rect x="300" y="10" width="40" height="20" transform="skewX(20)" fill="url(#lg2)"/>
  <polyline points="10,60 30,80 50,60" fill="none" stroke="red" stroke-width="3" marker-end="url(#arrow)"/>
  <polygon points="60,60 80,60 70,80" fill="currentColor" color="#008000"/>
  <path d="M100 60 A20 20 0 0 1 140 60 Z" fill="none" stroke="black" stroke-dasharray="1 3"/>
  <line x1="150" y1="60" x2="190" y2="90" stroke="black"/>
  <text x="10" y="120" font-family="'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#333333">Hello</text>
  <text x="200" y="120" text-anchor="middle" font-size="10" style="font-style:italic"><tspan x="200" y="120">Line one</tspan><tspan x="200" dy="12">Line two</tspan></text>
  <use xlink:href="#sym" x="300" y="100" width="20" height="20"/>
  <use href="#dot" x="350" y="150"/>
  <image x="10" y="150" width="40" height="20" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAEElEQVR4nGP4z8AARAwQCgAf7gP9i18U1AAAAABJRU5ErkJggg=="/>
  <rect class="hidden" x="0" y="0" width="5" height="5"/>
  <rect x="0" y="0" width="5" height="5" style="display:none"/>
</svg>
